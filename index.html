<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris's Butterfly Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div id="game-container">
        <!-- Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- UI Overlay -->
        <div id="ui-layer">
            <!-- HUD -->
            <div id="hud">
                <div class="hud-group left">
                    <div class="hud-item" id="score-box">
                        <span class="icon">✨</span>
                        <span id="score">0</span>
                    </div>
                    <div class="hud-item" id="high-score-box">
                        <span class="icon">🏆</span>
                        <span id="high-score">0</span>
                    </div>
                </div>
                <div class="hud-group right">
                    <div class="hud-item" id="lives-box">
                        <span id="lives">❤️❤️❤️</span>
                    </div>
                    <button id="sound-btn" class="btn-icon">🔊</button>
                    <button id="pause-btn" class="btn-icon">⏸</button>
                </div>
            </div>

            <!-- Task Display -->
            <div id="task-display" class="hud-item hidden">
                <span class="icon">🎯</span>
                <span id="task-text">收集 10 颗星星</span>
                <span id="task-progress">(0/10)</span>
            </div>

            <!-- Encouragement Text -->
            <div id="message-display" class="hidden"></div>
            
            <!-- Parent Easter Egg -->
            <div id="easter-egg-msg" class="hidden">
                <div id="egg-text"></div>
                <div style="font-size: 3rem;">💖</div>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="panel active">
                <h1 class="glow-text">🦋 Iris 的蝴蝶奇遇</h1>
                <div class="diff-selector">
                    <button class="btn-diff active" data-diff="practice">练习模式 (无限心)</button>
                    <button class="btn-diff" data-diff="easy">简单模式</button>
                    <button class="btn-diff" data-diff="normal">普通模式</button>
                    <button class="btn-diff" data-diff="hard">高手模式</button>
                </div>
                <div class="button-group">
                    <button id="start-btn" class="btn-main">开始冒险</button>
                </div>
                <div class="button-row">
                    <button id="how-to-play-btn" class="btn-icon" title="怎么玩">❓</button>
                    <button id="treasure-btn" class="btn-icon" title="我的宝贝">🎁</button>
                    <button id="parent-settings-btn" class="btn-icon" title="家长设置">⚙️</button>
                </div>
            </div>

            <!-- Parent Settings Screen -->
            <div id="parent-settings-screen" class="panel">
                <h2>⚙️ 家长辅助设置</h2>
                <div class="input-group">
                    <label>飞行速度</label>
                    <select id="setting-speed">
                        <option value="slow">慢速 (更简单)</option>
                        <option value="normal" selected>正常</option>
                        <option value="fast">快速 (更有挑战)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>碰撞容差</label>
                    <select id="setting-tolerance">
                        <option value="loose">宽松 (不容易撞到)</option>
                        <option value="standard" selected>标准</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>初始生命值</label>
                    <select id="setting-lives">
                        <option value="3">3 颗心</option>
                        <option value="5">5 颗心</option>
                        <option value="99" selected>无限生命</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>亲子鼓励寄语 (在高分时弹出)</label>
                    <input type="text" id="setting-message" placeholder="例如：Iris 你真棒，爱你！" maxlength="20">
                </div>
                <button id="close-settings-btn" class="btn-main">保存设置</button>
                <button id="reset-high-score-btn" class="btn-secondary">重置最高分</button>
            </div>

            <!-- Other panels unchanged... -->
            <div id="how-to-play-screen" class="panel">
                <h2>❓ 怎么玩</h2>
                <p>点击屏幕或者按空格键让蝴蝶向上飞，穿过花藤之间的空隙，躲开障碍物，收集星星。</p>
                <button id="close-how-to-btn" class="btn-main">明白了</button>
            </div>

            <div id="treasure-screen" class="panel">
                <h2>🎁 我的宝贝仓库</h2>
                <div class="tabs">
                    <button class="tab-btn active" id="tab-stickers">魔法贴纸</button>
                    <button class="tab-btn" id="tab-cosmetics">翅膀外观</button>
                </div>
                <div class="tab-content active" id="stickers-content">
                    <div class="sticker-grid">
                        <div class="sticker locked" id="sticker-star">⭐</div>
                        <div class="sticker locked" id="sticker-bunny">🐰</div>
                        <div class="sticker locked" id="sticker-rainbow">🌈</div>
                        <div class="sticker locked" id="sticker-flower">🌸</div>
                        <div class="sticker locked" id="sticker-butterfly">🦋</div>
                    </div>
                </div>
                <div class="tab-content" id="cosmetics-content">
                    <div class="cosmetic-grid">
                        <div class="cosmetic-item" data-id="default" data-cost="0">
                            <div class="cosmetic-preview">🦋</div>
                            <p>经典紫</p>
                            <button class="btn-buy owned">使用中</button>
                        </div>
                        <div class="cosmetic-item" data-id="pink-wings" data-cost="20">
                            <div class="cosmetic-preview" style="filter: hue-rotate(300deg);">🦋</div>
                            <p>甜心粉</p>
                            <button class="btn-buy">20 ✨</button>
                        </div>
                        <div class="cosmetic-item" data-id="star-trail" data-cost="50">
                            <div class="cosmetic-preview">✨</div>
                            <p>闪耀星踪</p>
                            <button class="btn-buy">50 ✨</button>
                        </div>
                        <div class="cosmetic-item" data-id="rainbow-wings" data-cost="100">
                            <div class="cosmetic-preview rainbow-anim">🦋</div>
                            <p>梦幻彩虹</p>
                            <button class="btn-buy">100 ✨</button>
                        </div>
                    </div>
                </div>
                <button id="close-treasure-btn" class="btn-main">返回</button>
            </div>

            <div id="pause-screen" class="panel">
                <h2>⏸ 休息一下</h2>
                <button id="resume-btn" class="btn-main">继续飞行</button>
                <button id="restart-from-pause-btn" class="btn-secondary">重新开始</button>
                <button id="back-to-home-from-pause-btn" class="btn-secondary">返回首页</button>
            </div>

            <div id="game-over-screen" class="panel">
                <h2 id="over-title">冒险结束啦！</h2>
                <div class="final-stats">
                    <p>本次得分: <span id="final-score">0</span></p>
                    <p>最高记录: <span id="record-score">0</span></p>
                </div>
                <button id="restart-btn" class="btn-main">再玩一次</button>
                <button id="back-to-home-btn" class="btn-secondary">返回首页</button>
            </div>

            <div id="dummy-panel" class="panel"></div>
        </div>
    </div>

    <!-- Sound for alerts -->
    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="script.js?v=4"></script>
</body>
</html>
